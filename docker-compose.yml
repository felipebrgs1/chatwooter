services:
  db:
    # pgvector sobre PG16: o snapshot exige a extensao `vector`
    # (article_embeddings, captain_assistant_responses, captain_faq_suggestions).
    image: pgvector/pgvector:pg16
    ports:
      - "${PGPORT:-5432}:5432"
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Object storage S3-compatível (anexos de mensagens).
  rustfs:
    image: rustfs/rustfs:latest
    command: server /data --address :9000
    ports:
      - "9000:9000"
    env_file:
      - .env
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin123}
    volumes:
      - rustfsdata:/data

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "${PORT:-4000}:4000"
    env_file:
      - .env
    environment:
      MIX_ENV: dev
      PGHOST: ${PGHOST:-db}
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:-postgres}
      PGDATABASE: ${PGDATABASE:-chatwooter_dev}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin123}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://rustfs:9000}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-http://localhost:9000}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-chatwooter-dev}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      PORT: ${PORT:-4000}
      WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL:-}
    volumes:
      - .:/app
      - app_deps:/app/deps
      - app_build:/app/_build
    depends_on:
      - db
      - rustfs
    stdin_open: true
    tty: true

volumes:
  pgdata:
  rustfsdata:
  app_deps:
  app_build:
