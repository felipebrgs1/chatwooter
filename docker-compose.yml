services:
  db:
    image: pgvector/pgvector:pg18
    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432" # testes do Go rodam no host
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-postgres}
      # criado no primeiro boot do volume; os testes do Go criam os próprios bancos
      POSTGRES_DB: ${PGDATABASE:-chatwooter_dev}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 2s
      retries: 30

  # Object storage S3-compatível (anexos de mensagens; o Go passa a usar na fase de canais).
  rustfs:
    image: rustfs/rustfs:latest
    command: server /data --address :9000
    ports:
      - "9000:9000"
    env_file:
      - .env
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin123}
    volumes:
      - rustfsdata:/data

  # API Go (:4100). Na subida aplica as migrations e o seed de dev (john@acme.inc), depois roda com hot reload.
  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    ports:
      - "4100:4100"
    environment:
      PORT: "4100"
      UPLOADS_DIR: ${UPLOADS_DIR:-./storage}
      # Só para desenvolvimento. Em produção: openssl rand -base64 32
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-Y2hhdHdvb3Rlci1kZXYtb25seS1rZXktMzJieXRlcyE=}
      DATABASE_URL: postgres://${PGUSER:-postgres}:${PGPASSWORD:-postgres}@db:5432/${PGDATABASE:-chatwooter_dev}?sslmode=disable
    command: sh -c "go run ./cmd/chatwooter migrate && go run ./cmd/chatwooter seed && exec go tool air -c .air.toml"
    volumes:
      - ./server:/app/server
      - go_mod:/go/pkg/mod
    depends_on:
      db:
        condition: service_healthy

  # Dashboard React (:5173), com proxy de /api, /auth e /cable para o server.
  web-ui:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      VITE_API_TARGET: http://server:4100
    volumes:
      - ./web:/app/web
      - web_node_modules:/app/web/node_modules
    depends_on:
      - server

volumes:
  go_mod:
  web_node_modules:
  pgdata:
  rustfsdata:
