services:
  db:
    image: pgvector/pgvector:pg18
    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432" # testes do Go rodam no host
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql

  # Object storage S3-compatível (anexos de mensagens).
  rustfs:
    image: rustfs/rustfs:latest
    command: server /data --address :9000
    ports:
      - "9000:9000"
    env_file:
      - .env
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin123}
    volumes:
      - rustfsdata:/data

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "${PORT:-4000}:4000"
    env_file:
      - .env
    environment:
      MIX_ENV: dev
      PGHOST: ${PGHOST:-db}
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:-postgres}
      PGDATABASE: ${PGDATABASE:-chatwooter_dev}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin123}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://rustfs:9000}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-http://localhost:9000}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-chatwooter-dev}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      PORT: ${PORT:-4000}
      WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL:-}
    volumes:
      - .:/app
      - app_deps:/app/deps
      - app_build:/app/_build
    depends_on:
      - db
      - rustfs
    stdin_open: true
    tty: true

  # Stack Go + React (migração, ver ROADMAP_MIGRACAO_GO_REACT.md). Suba com: docker compose --profile go up
  server:
    profiles: ["go"]
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    ports:
      - "4100:4100"
    environment:
      PORT: "4100"
      # Só para desenvolvimento. Em produção: openssl rand -base64 32
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-Y2hhdHdvb3Rlci1kZXYtb25seS1rZXktMzJieXRlcyE=}
      DATABASE_URL: postgres://${PGUSER:-postgres}:${PGPASSWORD:-postgres}@db:5432/${PGDATABASE:-chatwooter_dev}?sslmode=disable
    volumes:
      - ./server:/app/server
      - go_mod:/go/pkg/mod
    depends_on:
      - db

  web-ui:
    profiles: ["go"]
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      VITE_API_TARGET: http://server:4100
    volumes:
      - ./web:/app/web
      - web_node_modules:/app/web/node_modules
    depends_on:
      - server

volumes:
  go_mod:
  web_node_modules:
  pgdata:
  rustfsdata:
  app_deps:
  app_build:
